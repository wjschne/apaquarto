# The line spacing the Graduate School asks for: a block quotation single
# spaced and half an inch in from both margins, the entries of the reference
# list and of the table of contents single spaced within an entry and a double
# space apart, and widows and orphans avoided. The measurements are in the
# snapshots; what is checked here is that each format is asked for them.
- fixture: thesis-typography.qmd
  to: apaquarto-pdf
  expect:
    tex:
      contains:
        - '\apathesisquote'
        - '\apathesisreferences'
        - '\apathesispenalties'
        - '\apathesisnotes'
        # The contents entries are set single and stand a double space apart.
        - '\apathesissingle\setlength{\parskip}{\apathesisentrysep}'
    pdf:
      contains:
        - 'TABLE OF CONTENTS'
        - 'REFERENCES'

- fixture: thesis-typography.qmd
  to: apaquarto-typst
  expect:
    typ:
      contains:
        # The reference list is wrapped rather than set around, so the spacing
        # stops with the list and an appendix after it is unaffected.
        - '#thesisreferences['
        # A note's first line begins half an inch in, and a double space
        # stands between one note and the next.
        - 'noteindent: 0.5in'
        - 'notegap: 17.25pt'
    pdf:
      contains:
        - 'TABLE OF CONTENTS'
        - 'REFERENCES'

- fixture: thesis-typography.qmd
  to: apaquarto-docx
  expect:
    docx-styles:
      contains:
        # Block Text, NextBlockText, Bibliography and Footnote Text all take
        # it. Written without the closing bracket, since pandoc rewrites the
        # stylesheet and closes an empty element with a space before the
        # slash, and reorders the attributes of the element below.
        - '<w:spacing w:after="276" w:line="240" w:lineRule="auto"'
        # A note's first line is indented half an inch.
        - '<w:ind w:firstLine="720" />'
    docx-xml:
      contains:
        # And the contents entries, which are written out rather than styled.
        - '<w:spacing w:before="276" w:after="0" w:line="240" w:lineRule="auto"/>'

- fixture: thesis-typography.qmd
  to: apaquarto-html
  expect:
    html:
      contains:
        - 'blockquote p, .blockquote p { line-height: 1em; }'
        - '.csl-bib-body .csl-entry { line-height: 1em; margin-bottom: 1em; }'
        - '.footnotes li p { line-height: 1em; }'

# An apa-note belongs to a float of any kind, written either way round: on the
# image, or on the div that holds it. An Illustration is the kind apaquarto
# declares under crossref.custom, and it takes the note, the styles and the
# spacing a figure takes.
- fixture: illustration-note.qmd
  to: apaquarto-html
  expect:
    html:
      contains: ['zqfigimg', 'zqfigdiv', 'zqillimg', 'zqilldiv', 'zqtbl']

- fixture: illustration-note.qmd
  to: apaquarto-typst
  expect:
    pdf:
      contains: ['zqfigimg', 'zqfigdiv', 'zqillimg', 'zqilldiv', 'zqtbl']
      count:
        # Once each. Two filters can each take the note for theirs to write,
        # which is what prints it twice.
        'zqfigimg': 1
        'zqfigdiv': 1
        'zqillimg': 1
        'zqilldiv': 1
        'zqtbl': 1

- fixture: illustration-note.qmd
  to: apaquarto-pdf
  expect:
    pdf:
      contains: ['zqfigimg', 'zqfigdiv', 'zqillimg', 'zqilldiv', 'zqtbl']
      count:
        # Once each. Two filters can each take the note for theirs to write,
        # which is what prints it twice.
        'zqfigimg': 1
        'zqfigdiv': 1
        'zqillimg': 1
        'zqilldiv': 1
        'zqtbl': 1

- fixture: illustration-note.qmd
  to: apaquarto-docx
  expect:
    docx:
      contains: ['zqfigimg', 'zqfigdiv', 'zqillimg', 'zqilldiv', 'zqtbl']
    docx-xml:
      contains:
        # An illustration is styled as a figure is: the note held on the page
        # with it, and the paragraph after a float with no note given the
        # spacing that goes with that.
        - '<w:pStyle w:val="FigureNote" />'
        - '<w:pStyle w:val="FigureWithNote" />'
        - '<w:pStyle w:val="FigureWithoutNote" />'
        - '<w:pStyle w:val="AfterWithoutNote" />'
