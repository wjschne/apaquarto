        'clearpage': 0

- fixture: link-colours.qmd
  to: apaquarto-docx
  expect:
    docx-styles:
      contains:
        # A character style for each field, based on Hyperlink so that a
        # writer's own changes to it still come through. Written as pandoc
        # writes it: the styles are put into the reference document and
        # pandoc reads that and writes the stylesheet out again itself.
        - 'w:styleId="ApaUrlColor" w:type="character"><w:name w:val="ApaUrlColor" /><w:basedOn w:val="Hyperlink" /><w:rPr><w:color w:val="00FF00" /></w:rPr></w:style>'
        - 'w:styleId="ApaFileColor" w:type="character"><w:name w:val="ApaFileColor" /><w:basedOn w:val="Hyperlink" /><w:rPr><w:color w:val="800080" /></w:rPr></w:style>'
        - 'w:styleId="ApaLinkColor" w:type="character"><w:name w:val="ApaLinkColor" /><w:basedOn w:val="Hyperlink" /><w:rPr><w:color w:val="CC0000" /></w:rPr></w:style>'
        - 'w:styleId="ApaCiteColor" w:type="character"><w:name w:val="ApaCiteColor" /><w:basedOn w:val="Hyperlink" /><w:rPr><w:color w:val="FF8000" /></w:rPr></w:style>'
    docx-xml:
      contains:
        # A link reaches one of those styles only through a run inside it:
        # pandoc ignores custom-style on a Link and honours it on a Span.
        - '<w:rStyle w:val="ApaUrlColor" /></w:rPr><w:t xml:space="preserve">weblink</w:t>'
        - '<w:rStyle w:val="ApaFileColor" /></w:rPr><w:t xml:space="preserve">filelink</w:t>'
        - '<w:rStyle w:val="ApaLinkColor" /></w:rPr><w:t xml:space="preserve">Figure 1</w:t>'
        - '<w:rStyle w:val="ApaCiteColor" /></w:rPr><w:t xml:space="preserve">Schneider &amp; McGrew, 2018</w:t>'
        # toccolor is written into the runs of the lists, which carry no
        # style of their own to hang it on.
        - '<w:color w:val="008080"/></w:rPr><w:t xml:space="preserve">First</w:t>'
      absent:
        # The heading above a list is not a link and takes no toccolor.
        - '<w:color w:val="008080"/></w:rPr><w:t xml:space="preserve">Contents</w:t>'

- fixture: link-colours.qmd
  to: apaquarto-html
  expect:
    html:
      contains:
        - 'main a[href^="#"] { color: #CC0000; }'
        - 'main a[href*="//"], main a[href^="mailto:"] { color: #00FF00; }'
        - 'main .citation a { color: #FF8000; }'
        - 'main .apaquarto-contents a, nav#TOC a.nav-link { color: #008080; }'
        # filecolor is what is neither an anchor nor a url.
        - 'main a[href]:not([href^="#"]):not([href*="//"]):not([href^="mailto:"]) { color: #800080; }'
        # The contents apaquarto builds into the page is in a div of its own,
        # which is what toccolor names.
        - 'apaquarto-contents'

- fixture: jou-link-colours.qmd
  to: apaquarto-typst
  expect:
    typ:
      contains:
        # The author note holds the correspondence line and nothing else.
        # The show rules used to be written into the body before the front
        # matter was split, and the split took a raw block at the end of it
        # for the last block of the note: the rule that colours a link ended
        # up inside the note, colouring the note's own links and no others.
        - "#link(\"mailto:test@example.com\")[test\\@example.com]\n\n]\n"
        - '#show outline.entry: it => {show link: set text(fill: rgb("#008080"))'
        # And it stands ahead of the masthead, so that the corresponding
        # author's email and the link in the abstract take it too.
        - "  text(fill: c, it)\n}\n\n#place(top, scope: \"parent\", float: true"
      absent:
        # Journal mode runs continuously: no list begins a page of its own.
        - '#pagebreak()'

- fixture: link-colours.qmd
  to: apaquarto-typst
  expect:
    typ:
      contains:
        # typst knows some of xcolor's names and means something else by
        # them, and knows nothing of violet at all, so the name is resolved
        # here and typst is handed the code.
        - 'if d.starts-with("mailto:") or d.contains("://") { rgb("#00FF00") }'
        - 'else { rgb("#800080") }'
        - '} else if type(d) == label and str(d).starts-with("ref-") {'
        - '    rgb("#FF8000")'
        - '} else { rgb("#CC0000") }'
        # An entry of a list links to a location and is left to the rule
        # the list writes over its own entries.
        - '  if type(d) == location { return it }'
        # The entries of a list take toccolor, and the rule above is written
        # after the outlines so that it does not override them.
        - '#show outline.entry: it => {show link: set text(fill: rgb("#008080"))'

- fixture: link-colours.qmd
  to: apaquarto-pdf
  expect:
    tex:
      contains:
        # hyperref takes a colour by name, so a code is defined as a colour
        # of its own and the field rewritten to name it.
        - '\definecolor{apacolorlink}{HTML}{CC0000}'
        - 'linkcolor={apacolorlink},'
        - 'citecolor={orange},'
        - 'urlcolor={green},'
        # toccolor, which pandoc's template does not write out at all.
        - '\renewcommand{\apatoccolor}{teal}'
        # hyperref calls [text](figure.png) a url and colours it urlcolor, so
        # filecolor is set around such a link in a group of its own.
        - '\begingroup\hypersetup{urlcolor=violet}\href{sampleimage.png}{filelink}\endgroup'

- fixture: thesis-title.qmd
  to: apaquarto-pdf
  expect:
    tex:
      contains:
        # The title in capitals, broken into an inverted pyramid: the first
        # line longest, each line after it shorter. The lines are worked out
        # in lua, so these are the same three in all four formats.
        - '\bfseries A STUDY OF WHATEVER IT IS THAT GRADUATE STUDENTS STUDY WHEN\\'
        - 'THEY ARE STUDYING SOMETHING AT CONSIDERABLE\\'
        - 'AND NOTABLE LENGTH\par}'
        # A rule under each of the three blocks below the title.
        - '\rule{5.50in}{0.5pt}'
        # Page i carries no number, and there is no running head at all.
        - '\thispagestyle{empty}'
        - '\apathesishead\pagenumbering{roman}'
        # The front matter is in lower-case roman and the body begins again
        # at 1 in arabic.
        - '\restoregeometry\doublespacing\pagenumbering{arabic}'
        # The title page is set on 1" all round, so that its block stands at
        # the centre of the paper; every page after it takes the handbook's
        # 1.5" binding margin. A change of geometry puts the line spacing
        # back to the document's, so the single spacing is asked for again
        # after each one.
        - '\newgeometry{left=1.00in,right=1.00in,top=1.00in,bottom=1.00in}'
        - '\newgeometry{left=1.50in,right=1.00in,top=1.00in,bottom=1.00in}'
        # The copyright page, whose year is the year of the diploma date.
        - '© Copyright 2027 by Iwishiwere A. Graduate'
        # The examining committee begins where the rules above it begin
        # rather than out at the margin.
        - '\raggedright\noindent\leftskip=0.50in\relax'
        # The abstract, under a heading of its own and flush at the margin,
        # and the dedication, centred with no heading at all.
        - '\bfseries ABSTRACT\par}'
        - '{\setlength{\parindent}{0pt}'
        - 'For the committee, who read it all.\par}'
        # The acknowledgments, set like the abstract: a heading in capitals
        # and prose flush at the margin under it.
        - '\bfseries ACKNOWLEDGMENTS\par}'
        - 'Thanks to everyone who read a draft.'
        # The contents: the front matter in capitals, the chapters under a
        # label reading CHAPTER with their arabic numbers, and the back
        # matter --- the references, and the appendices lettered in the
        # order they are mentioned. The copyright page is not listed and
        # neither is the contents itself.
        - '\bfseries TABLE OF CONTENTS\par}'
        - '\hyperref[apathesis-abstract]{\textcolor{apathesistoc}{ABSTRACT}}\apadotfill'
        - '\makebox[0.25in][l]{1.}\hyperref[introduction]{\textcolor{apathesistoc}{INTRODUCTION}}'
        - '\makebox[0.25in][l]{2.}\hyperref[method]{\textcolor{apathesistoc}{METHOD}}'
        - '\hyperref[references]{\textcolor{apathesistoc}{REFERENCES}}'
        - '\makebox[0.25in][l]{A.}\hyperref[apx-measures]{\textcolor{apathesistoc}{MEASURES USED}}'
        - '\makebox[0.25in][l]{B.}\hyperref[apx-consent]{\textcolor{apathesistoc}{CONSENT FORMS}}'
        # The lists of tables, figures and illustrations, each under a
        # heading of its own with the two column labels over the entries.
        # The contents lists them too, with the pages they begin on.
        - '\bfseries LIST OF TABLES\par}'
        - '\bfseries LIST OF FIGURES\par}'
        - '\bfseries LIST OF ILLUSTRATIONS\par}'
        # The entries of a contents are black unless toccolor says
        # otherwise: they are links and would take the link colour.
        - '\definecolor{apathesistoc}{HTML}{000000}'
        - '\hyperref[apathesis-list-of-table]{\textcolor{apathesistoc}{LIST OF TABLES}}'
        - '{\parindent=0pt\noindent Table\hfill Page\par}'
        - '{\parindent=0pt\noindent Illustration\hfill Page\par}'
        # An illustration is a figure with a word and a count of its own, so
        # it is numbered from one rather than after the figures. It is in the
        # second appendix, so it carries that letter, as the table and the
        # figure beside it do.
        - '\makebox[0.25in][l]{B1.}\hyperref[ill-sketch]'
        # In the body every level-one heading is in capitals, and over each
        # chapter stands the word CHAPTER and its number. The references
        # have a part of their own to play and get no such line.
        - '\section*{CHAPTER 1}'
        - '\section*{CHAPTER 2}'
        - '\section{INTRODUCTION}'
        - '\section{METHOD}'
        - '\section{REFERENCES}'
        # Every major division begins a page of its own: each chapter, the
        # sources section, and each appendix. The break before an appendix is
        # written for .docx and typst elsewhere, so only latex wants one here.
        - "\\clearpage\n\n\\section{REFERENCES}"
        - "\\clearpage\n\n\\section{APPENDIX A}"
        # The spacing is set between the blocks rather than inside them:
        # setspace works the stretch into the size command, and a stretch
        # asked for inside the group that holds a paragraph does not reach
        # the lines of it.
        - '\singlespacing'
        - '\doublespacing'
        # What the work is, what degree it answers to, who wrote it.
        - 'A Dissertation\\'
        - 'of the Requirements for the Degree\\'
        - 'Iwishiwere A. Graduate\\'
        # The committee, flush left at the foot.
        - 'Examining Committee Members:\par}'
        - 'Mentor Name, Advisory Chair, TU Department\\'
        - 'Outside Name, External Member, Another University\par}'
      absent:
        # thesis mode has a front matter of its own, so the APA title page is
        # not built as well. apatitlepageheading is what sets the headings of
        # that page --- Author Note, Abstract, Impact Statement --- so none of
        # it is here. Its definition in apalatex.tex is always written out;
        # a call to it is what would mean the page was built.
        - '\apatitlepageheading{'
        # A subheading is listed only where contents-depth asks for one, and
        # the copyright page is never listed in the contents.
        - 'Background}\apadotfill'
        - 'Copyright}\apadotfill'
        # Only the chapters carry a CHAPTER line, and the contents lists a
        # chapter by its own name rather than by the line above it.
        - '\section*{CHAPTER 3}'
        - 'CHAPTER 1}\apadotfill'
      count:
        # Six pages of front matter: the title page, the copyright page, the
        # abstract, the dedication, the acknowledgments and the contents.
        - text: '\clearpage'
          times: 6

- fixture: thesis-title.qmd
  to: apaquarto-typst
  expect:
    typ:
      contains:
        - '#strong[A STUDY OF WHATEVER IT IS THAT GRADUATE STUDENTS STUDY WHEN \'
        - '#line(length: 5.50in, stroke: 0.5pt)'
        - 'Examining Committee Members:'
        # The title page on 1" all round and carrying nothing at the foot,
        # the copyright page on the handbook's margins and numbered, and the
        # body beginning again at 1.
        - '#page(margin: (left: 1.00in, right: 1.00in, top: 1.00in, bottom: 1.00in), header: none, footer: none, numbering: none)'
        - '#page(margin: (left: 1.50in, right: 1.00in, top: 1.00in, bottom: 1.00in))'
        - '#counter(page).update(1)'
        # The committee sits under the rules, and the abstract and the
        # dedication are pages of their own.
        - '#pad(left: 0.50in)'
        - '#strong[ABSTRACT]'
        - 'For the committee, who read it all.'
        - '#strong[ACKNOWLEDGMENTS]'
        # The contents, whose page numbers typst works out for itself at the
        # place each label stands: roman for the front matter, arabic for the
        # body, since the counter restarts between them.
        - '#strong[TABLE OF CONTENTS]'
        - '#apatocline(0.00in, none, [CHAPTER], none, false, false)'
        - '#apatocline(0.00in, [1.], [INTRODUCTION], <introduction>, false, true)'
        - '#apatocline(0.00in, [A.], [MEASURES USED], <apx-measures>, false, true)'
        - '#apatocline(0.00in, none, [ABSTRACT], <apathesis-abstract>, true, true)'
        - '#strong[LIST OF TABLES]'
        - '#strong[LIST OF ILLUSTRATIONS]'
        - '#heading(level: 1, outlined: false, numbering: none)[CHAPTER 1]'
        - '= INTRODUCTION'
        - '#apatocline(0.00in, [B1.], [A sketch of the apparatus.], <ill-sketch>, false, true)'
    pdf:
      contains:
        - 'A STUDY OF WHATEVER IT IS THAT GRADUATE STUDENTS STUDY WHEN'
        - 'the Temple University Graduate Board'
        - 'Outside Name, External Member, Another University'
        - 'All Rights Reserved'
        - 'An abstract that says what the work found'
        - 'Thanks to everyone who read a draft.'
        - 'For the committee, who read it all.'

- fixture: thesis-title.qmd
  to: apaquarto-docx
  expect:
    docx-xml:
      contains:
        # The title is bold and centred, and its lines are broken where lua
        # broke them rather than wherever word would have wrapped them.
        - '<w:jc w:val="center"/></w:pPr><w:r><w:rPr><w:b/></w:rPr><w:t xml:space="preserve">A</w:t>'
        - '<w:r><w:br/></w:r>'
        # The rule is a paragraph with a border under it, which is how word
        # draws one.
        - '<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="0" w:color="auto"/></w:pBdr>'
        # The title page is a section of its own, which is how it gets
        # margins that are not the rest of the document's: 1" all round,
        # against the 1.5" binding margin every page after it takes. It names
        # no header, so no running head, and w:titlePg sends its one page to
        # the empty "first" footer, so no number either.
        - '<w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/><w:pgNumType w:fmt="lowerRoman" w:start="1"/><w:cols w:space="720"/><w:titlePg/>'
        # The copyright page continues the roman numbering and does carry it.
        - '<w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="2160" w:header="720" w:footer="720" w:gutter="0"/><w:pgNumType w:fmt="lowerRoman"/>'
        # The committee begins where the rules begin, and the abstract takes
        # the style apaquarto gives the first paragraph of an APA abstract,
        # which is the one with no first line indented.
        - '<w:ind w:left="720"/>'
        - '<w:pStyle w:val="AbstractFirstParagraph" />'
        # A contents entry is a link to a bookmark and a PAGEREF field for
        # the page it is on, with a right tab and dot leaders between them.
        # Nothing else in a .docx knows where word will break the pages.
        - '<w:tab w:val="right" w:leader="dot" w:pos="8640"/>'
        - '<w:hyperlink w:anchor="apathesis-abstract">'
        - ' PAGEREF apathesis-abstract \h '
        - ' PAGEREF apx-consent \h '
        # And the front matter pages carry the bookmarks those point at.
        - '<w:bookmarkStart w:id="8001" w:name="apathesis-abstract"/>'
    docx:
      contains:
        - 'Examining Committee Members:'
        - 'Mentor Name, Advisory Chair, TU Department'
        - 'All Rights Reserved'
        - 'For the committee, who read it all.'
        - 'Thanks to everyone who read a draft.'
        - 'TABLE OF CONTENTS'
        - 'CHAPTER'
        - 'LIST OF TABLES'
        - 'LIST OF ILLUSTRATIONS'
        - 'A sketch of the apparatus.'
        - 'CHAPTER 1'
        - 'INTRODUCTION'

- fixture: thesis-title.qmd
  to: apaquarto-html
  expect:
    html:
      contains:
        - 'thesis-front-matter-page'
        - 'A STUDY OF WHATEVER IT IS THAT GRADUATE STUDENTS STUDY WHEN'
        - 'Examining Committee Members:'
        # There are no pages here, so a contents entry is the words and a
        # link to them and nothing more.
        - 'TABLE OF CONTENTS'
        - '<a href="#apx-measures">A. MEASURES USED</a>'
        - 'LIST OF ILLUSTRATIONS'

