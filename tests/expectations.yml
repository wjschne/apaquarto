# ------------------------------------------------------- measured layout --
#
# Where the lines sit on the page, measured from the rendered .pdf rather
# than read from the .tex or .typ (see layout_failures() in run-tests.R).

- fixture: layout-journal.qmd
  to: apaquarto-pdf
  expect:
    layout: &journal-layout
      # The space between paragraphs is the line spacing.
      - gap: [Alphaone, Betaone]
        is: 12
      # Headings as the Journal of Educational Psychology sets them.
      - gap: [Betaone, Headone]
        is: 26
      - gap: [Headone, Gammaone]
        is: 18
      - gap: [Gammaone, Headtwo]
        is: 26
      - gap: [Headtwo, Deltaone]
        is: 18
      - gap: [Deltaone, Headthree]
        is: 26
      - gap: [Headthree, Epsilonone]
        is: 18
      - gap: [Wrapone, wrapend]
        is: 13
      # A point larger than the body.
      - size: Betaone
        is: 10
      - size: Headone
        is: 11
      - size: Headtwo
        is: 11
      - size: Headthree
        is: 11
      # The 0.75in margin and every paragraph's 10pt indent.
      - left: Alphaone
        is: 64

- fixture: layout-journal.qmd
  to: apaquarto-typst
  expect:
    layout: *journal-layout

- fixture: layout-manuscript.qmd
  to: apaquarto-pdf
  expect:
    layout:
      # Double spaced from one paragraph to the next.
      - gap: [Alphaone, Betaone]
        is: 24
      - gap: [Gammaone, Deltaone]
        is: 24
      # The inch of margin and the half-inch indent.
      - left: Alphaone
        is: 108
      - size: Betaone
        is: 12

- fixture: layout-manuscript.qmd
  to: apaquarto-typst
  expect:
    layout:
      # Double spaced throughout, 24pt as in the .pdf: from paragraph to
      # paragraph, around a heading (the first paragraph after one included)
      # and around a block quotation.
      - gap: [Alphaone, Betaone]
        is: 24
      - gap: [Betaone, Headone]
        is: 24
      - gap: [Headone, Gammaone]
        is: 24
      - gap: [Gammaone, Deltaone]
        is: 24
      - gap: [Deltaone, Quoteone]
        is: 24
      - gap: [quotelast, Epsilonone]
        is: 24
      - left: Alphaone
        is: 108
      # A block quotation half an inch in.
      - left: Quoteone
        is: 108
      - size: Betaone
        is: 12

- fixture: layout-journal-quote.qmd
  to: apaquarto-pdf
  expect:
    layout: &journal-quote
      # 16pt in from the column's edge at 54pt, as quote.pdf sets one...
      - left: Quoteone
        is: 70
      # ...and out to the column's right edge, as the justified body is.
      - right: Quoteone
        is: 295
      - right: Bodyone
        is: 295
      # A quotation with an attribution: its first paragraph is not indented
      # either. typst indented it, 10pt.
      - left: Attrtwo
        is: 70
      # Its attribution a line of the quotation's spacing under its last line.
      - gap: [attrlast, —Aeschylus]
        is: 12

- fixture: layout-journal-quote.qmd
  to: apaquarto-typst
  expect:
    layout: *journal-quote

- fixture: layout-chunk-note.qmd
  to: apaquarto-pdf
  expect:
    layout:
      # The same picture from a chunk and from markdown: each note the same
      # distance under its caption, inside the float. Outside it, after
      # \end{figure}, the chunk's note was 14pt further down.
      - gap: [Chunkcap, Chunknote]
        is: 271
      - gap: [Mdcap, Mdnote]
        is: 271
      # A figure at the foot of a page: its note on the same page. A gap is
      # measured on the first word's page, so it fails if the note went over.
      - gap: [Breakcap, Breaknote]
        is: 144

- fixture: layout-table-keep.qmd
  to: apaquarto-pdf
  expect:
    layout:
      # A gap is measured on the first word's page, so each fails if the
      # second word went over to the next page.
      #
      # The tables longtable stranded the titles of: each caption on the
      # page its table's first row is on.
      - gap: [Keepone, Rowone]
        is: 65
      - gap: [Keepthree, Rowthree]
        is: 86
      # The tables there was room for: each on the page of the line before it.
      - gap: [Lasttwo, Keeptwo]
        is: 73
      - gap: [Lastfour, Keepfour]
        is: 73

- fixture: layout-document.qmd
  to: apaquarto-typst
