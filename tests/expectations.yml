# ------------------------------------------------------ contents in word --

- fixture: docx-contents.qmd
  to: apaquarto-pdf
  expect:
    tex:
      contains:
        # The whole of a cross reference is one link, not just its number:
        # quarto writes the word, a hard space and a ref; hyperref colours
        # only the number and leaves the word beside it plain.
        - 'hyperref[fig-one]{Figure~'
        # Every float writes its own line; the two commands read them back.
        - 'addcontentsline{lof}{figure}'
        - 'addcontentsline{lot}{table}'
        - 'apalistoffigures'
        - 'apalistoftables'
    pdf:
      contains:
        - 'List of Figures'
        - 'List of Tables'
        # The same line the other two formats give.
        - 'Figure 1. A first figure.'
        - 'Table 1. A first table.'

- fixture: docx-contents.qmd
  to: apaquarto-docx
  expect:
    docx:
      contains:
        - 'Table of Contents'
        - 'List of Figures'
        - 'List of Tables'
        - 'A first figure.'
        - 'A first table.'
        # Placed by apaquarto, so the heading it carries is there too and the
        # field pandoc would have written at the top of the body is not.
        - 'Method'
    docx-xml:
      contains:
        # Each entry is a link to its float rather than a page number, which
        # would need a field and so an update.
        - 'w:anchor="fig-one"'
        - 'w:anchor="tbl-one"'
        # The page number of each entry, which has to be a field: nothing
        # here knows where Word will break the pages.
        - 'PAGEREF fig-one'
        - 'PAGEREF tbl-one'
        # Word takes no bookmark name of more than 40 characters, so pandoc
        # hashes a longer identifier: the sha1 with an X for its first
        # character. A link asking for the identifier itself would point at
        # nothing, which is what the contents used to do for this heading.
        - 'w:name="Xc24c7f1fa98fcadd084ea98e1299ca9922ae76c"'
        - 'w:anchor="Xc24c7f1fa98fcadd084ea98e1299ca9922ae76c"'
      absent:
        # Not marked dirty. Word updates a dirty field while it loads the
        # document, before the pages are laid out, so every PAGEREF answers
        # 1, and the 1 stays once the update has cleared the flag. Left
        # alone, the entry is there from the start and the numbers arrive
        # correct the first time anything makes Word paginate and update.
        - 'w:dirty'
      count:
        # The title, the author note and the three list headings, plus the
        # writer's own {.unlisted} heading. An outline level of 9 does not
        # take a Heading 1 out of Word's own contents field -- TOC \o
        # collects the built-in heading styles whatever outline level is set
        # -- so each of these takes a style of apaquarto's own, which Word
        # does not know as a heading.
        'ApaUnlistedHeading': 6
        # One break from the front matter, which opens the first list, then
        # one after each of the three, so every list has a page to itself and
        # the body starts on the page after the last of them. This is how
        # typst sets them, where each outline is followed by a #pagebreak().
        # Checked in Word: title page, contents, figures, tables, body.
        '<w:br w:type="page"/>': 4
    log:
      contains:
        # Said once at the end of the render, because the page numbers cannot
        # be filled in from here and whoever asked for the list is the person
        # who needs to know.
        - 'select all with ctrl+a'

# ---------------------------------------------------- numbering of floats --

- fixture: float-numbering.qmd
  to: apaquarto-docx
  expect:
    docx:
      contains:
        - 'The second figure.'
        - 'The third figure.'
      count:
        # Each number once in the body title, once in the list of figures,
        # and once more where the text refers to it -- except the third,
        # which nothing refers to. The point is that they differ at all: the
        # multipanel figure used to repeat the number of the float before it,
        # so this read Figure 1, Figure 1, Figure 3.
        'Figure 1': 3
        'Figure 2': 3
        'Figure 3': 2
    docx-xml:
      count:
        # One break before the appendix, not two. This fixture writes its
        # appendix the older way --- "# Appendix A" over a title of its own
        # --- which leaves two headings in a row that both open an appendix,
        # and a break before each left the first alone on a page.
        - text: '<w:br w:type="page"/>'
          times: 4

- fixture: float-numbering.qmd
  to: apaquarto-typst
  expect:
    pdf:
      contains:
        # Right in the body and, since the list reads the appendix counter
        # where the float is, right in the list as well.
        - 'Figure A1'
        - 'Table A1'

- fixture: float-numbering.qmd
  to: apaquarto-pdf
  expect:
    pdf:
      contains:
        - 'Figure A1'
        - 'Table A1'
    tex:
      count:
        # One break before the appendix, not two: this fixture writes its
        # appendix the older way, which leaves two headings in a row that
        # both open one. The .pdf had no break at all until 6.0.1.
        - text: "\\clearpage\n\n\\section{Appendix}"
          times: 1

# ------------------------------------------- a contents in every format --

- fixture: contents-everywhere.qmd
  to: apaquarto-html
  expect:
    html:
      contains:
        - 'Table of Contents'
        # The entry is a link to the heading, since .html has no pages.
        - 'href="#method"'
        - 'href="#procedure"'

- fixture: contents-everywhere.qmd
  to: apaquarto-docx
  expect:
    docx:
      contains:
        - 'Table of Contents'
    docx-xml:
