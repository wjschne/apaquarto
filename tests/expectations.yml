        - '#page(margin: (left: 1.00in, right: 1.00in, top: 1.00in, bottom: 1.00in), header: none'
      count:
        # The front matter after the title page: the document's two inches.
        '#page(margin: (left: 2.00in, right: 1.00in, top: 1.00in, bottom: 1.00in))[': 3

