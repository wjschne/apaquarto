# ------------------------------------------------------- justified body --

- fixture: justified-jou.qmd
  to: apaquarto-pdf
  expect:
    tex:
      contains:
        # ragged2e's justifying, which turns off the RaggedRight the preamble
        # asks for. The indent is set with it: the two lengths are only kept
        # in step by whichever of the pair was asked for last.
        - '\justifying'
        - 'setlength{\JustifyingParindent}{\apajouparindent}'

