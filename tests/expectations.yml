        # School's inch elsewhere.
        - '<w:pgMar w:bottom="1440" w:footer="720" w:gutter="0" w:header="720" w:left="2880" w:right="1440" w:top="1440" />'
      count:
        # The front matter after the title page takes the document's two
        # inches as well.
        '<w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="2880"': 3
        '<w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="2160"': 0

- fixture: margins-thesis.qmd
  to: apaquarto-typst
  expect:
    layout:
      # Where the body text starts on the page: the document's 2in and the half-inch indent.
      - left: Some
        is: 180
    typ:
      contains:
        # The body: the document's margin, after the thesis layout's.
        - '  margin: (left: 2in,),'
