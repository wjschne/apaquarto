      - left: Quoteone
        is: 108
      - right: Bodyone
        is: 539
      - right: Quoteone
        is: 539

# ------------------------------------------- a quotation's dash attribution --

- fixture: quote-attribution.qmd
  to: apaquarto-html
  expect:
    html:
      count:
        # The first and the fourth; not the dash-only quotation, and not the
        # one inside no-attribution.
        'class="quote-attribution"': 2
      contains:
        - '1814/1990'

- fixture: quote-attribution.qmd
  to: apaquarto-docx
  expect:
    docx-xml:
      count:
        '<w:pStyle w:val="QuoteAttribution" />': 2
        # The second paragraph of the fourth quotation, as before.
        '<w:pStyle w:val="NextBlockText" />': 1
    docx:
      contains:
        # The markup and the citation kept.
        - 'Attributionone, Mansfield Park (1814/1990)'
    docx-styles:
      contains:
        # Right-aligned and based on Block Text, whether the reference
        # document ships the style (apaquarto.docx now does) or
        # docxreferencedoc.lua writes it in for one that does not.
        - 'w:styleId="QuoteAttribution"'
        - '<w:name w:val="QuoteAttribution" /><w:basedOn w:val="BlockText" /><w:pPr><w:jc w:val="right" />'

- fixture: quote-attribution.qmd
  to: apaquarto-pdf
  expect:
    tex:
      count:
        '\begin{apaquoteattribution}': 2
    layout:
      # A quotation half an inch in on the left and not at all on the right.
      - left: Quoteone
        is: 108
      # The attribution against the right margin, the quotation's right
      # edge; the quotations that are not attributions stay on the left.
      - right: Attributionone
        is: 540
      - right: Attributiontwo
        is: 540
      # The word after the dash and its space, in a line that starts at the
      # quotation's left edge.
      - left: Dashonly
        is: 121
      # A line of the double spacing between the quotation's last line and
      # its attribution: not a blank line and \parsep more, as it had been.
      - gap: [quotelast, Attributionone]
        is: 24

- fixture: quote-attribution.qmd
  to: apaquarto-typst
  expect:
    typ:
      count:
        # In a content block of its own, not an align: an align is a block,
        # and set the attribution off by the quotation's space around blocks.
        '#[#set align(right)': 2
      contains:
        - '#emph[Mansfield Park] (#link(<ref-austenMansfieldPark1990>)[1814/1990])'
    layout:
      - left: Quoteone
        is: 108
      # Against the right margin, the quotation's right edge.
      - right: Attributionone
        is: 539
      - right: Attributiontwo
        is: 539
      # A line of the double spacing above the attribution, not the
      # quotation's space around blocks as well.
      - gap: [quotelast, Attributionone]
        is: 24
      # The word after the dash and its space, in a line that starts at the
      # quotation's left edge, 108pt.
      - left: Dashonly
        is: 123
