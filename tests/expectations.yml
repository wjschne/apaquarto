        - 'PAGEREF method'

- fixture: contents-everywhere.qmd
  to: apaquarto-typst
  expect:
    typ:
      contains:
        # typst's own outline, which list-of-contents now asks for as well
        # as toc: true.
        - '#outline(title: [Table of Contents]'
    pdf:
