# What each fixture should produce.
#
# One entry per fixture and format. `to` is the format to render, and `expect`
# is keyed by the extension of the file to read: html, docx, pdf, tex or typ.
# Under each of those:
#
#   contains  text that must appear
#   absent    text that must not appear
#   count     text, and exactly how many times it must appear
#   order     texts that must appear in the order listed
#
# All four are plain text, matched literally, never as a regular expression.
# Keep every string in single quotes so that a backslash means a backslash.
#
# What to assert: the thing the fixture is for. A check that merely restates
# what the renderer happens to do today will break on every harmless change and
# teach everyone to ignore it. A check tied to the bug the fixture was written
# for goes off when that bug comes back, which is the whole point.

# --------------------------------------------------------- notes and panels --

- fixture: multipanel-notes.qmd
  to: apaquarto-html
  expect:
    html:
      contains:
        - 'Panel A'
        - 'Panel B'
        - 'A note belonging to the whole figure.'
        - 'A note belonging to the first panel.'
        - 'A note belonging to the second panel.'
        - 'A note belonging to the table.'
      absent:
        # Quarto's own panel label, which apaquarto replaces.
        - '(a)'
        # A replacement character in a class list: an attribute value read as
        # though it were a class.
        - "�"
      count:
        # One note per panel, centred, and one each for the figure as a whole
        # and for the table, flush left. The class is matched with its
        # attribute name, since the style is named twice in every note div:
        # once as a class and once as data-custom-style.
        'class="SubPanelNote': 2
        'class="FigureNote NoIndent"': 2

- fixture: multipanel-notes.qmd
  to: apaquarto-docx
  expect:
    docx:
      contains:
        - 'Panel A'
        - 'Panel B'
        - 'A note belonging to the whole figure.'
        - 'A note belonging to the first panel.'
        - 'A note belonging to the second panel.'
        - 'A note belonging to the table.'
    docx-xml:
      count:
        # The reference document's table style draws the rules of an APA
        # table, which belong to the data table and to no figure: the layout
        # table holding the panels takes FigureLayout. This said Table must
        # be absent altogether, which kept the data table bare as well
        # (wjschne/apaquarto#168).
        'w:tblStyle w:val="Table"': 1
        'w:tblStyle w:val="FigureLayout"': 1

- fixture: multipanel-notes.qmd
  to: apaquarto-docx
  expect:
    docx-xml:
      count:
        # The layout table holding the two panels, and the data table further
        # down.
        '<w:tbl>': 2
        # One row for the two panels, three for the data table. This is what
        # says the panels are beside each other: quarto writes a table for
        # each panel when the panels carry labels of their own, a row of two
        # cells with the panel in the first and the second empty, and word
        # sets each table under the one before it. Two tables alone would
        # still count right with the panels stacked in two rows.
        '<w:tr>': 4

- fixture: docx-table-style.qmd
  to: apaquarto-docx
  expect:
    docx:
      contains:
        - 'Plainhead'
        - 'Notedhead'
        - 'Chunkhead'
        - 'Lefthead'
        - 'Righthead'
    docx-xml:
      count:
        # Five data tables with the APA rules: the plain one, the one with a
        # note, the chunk's, and the two in panels. The plain and noted
        # tables were FigureLayout, with no rules.
        'w:tblStyle w:val="Table"': 5
        # The one grid holding the panels.
        'w:tblStyle w:val="FigureLayout"': 1

# The same figure with panels that carry no labels of their own, which takes a
# different path here and through quarto.

- fixture: multipanel-notes-plain.qmd
  to: apaquarto-html
  expect:
    html:
      contains:
        - 'Panel A'
        - 'Panel B'
        - 'A note belonging to the whole figure.'
        - 'A note belonging to the left panel.'
        - 'A note belonging to the right panel.'
      count:
        'class="SubPanelNote': 2
        'class="FigureNote NoIndent"': 1

- fixture: multipanel-notes-plain.qmd
  to: apaquarto-docx
  expect:
    docx:
      contains:
        - 'Panel A'
        - 'Panel B'
        - 'A note belonging to the whole figure.'
        - 'A note belonging to the left panel.'
        - 'A note belonging to the right panel.'
    docx-xml:
      count:
        # One layout table, holding the two panels side by side.
        '<w:tbl>': 1
      absent:
        - 'w:tblStyle w:val="Table"'

- fixture: multipanel-notes.qmd
  to: apaquarto-typst
  expect:
    pdf:
      contains:
        - 'Panel A'
        - 'Panel B'
        - 'A note belonging to the whole figure.'
        - 'A note belonging to the first panel.'
        - 'A note belonging to the table.'
      absent:
        - '??'
    typ:
      contains:
        # The grid apaquarto builds itself, rather than quarto's.
        - '#grid(columns: 2'

- fixture: multipanel-notes.qmd
  to: apaquarto-pdf
  expect:
    pdf:
      contains:
        - 'Panel A'
        - 'Panel B'
        - 'A note belonging to the whole figure.'
        - 'A note belonging to the first panel.'
        - 'A note belonging to the table.'
      absent:
        - '??'
    tex:
      contains:
        - 'begin{apapanel}'
      count:
        # Two panels side by side in one figure environment. A panel left as a
        # float of its own would make a figure within a figure, which latex
        # sets one under the other whatever the layout asked for.
        'begin{apapanel}': 2
        # Named with its placement, so that the figure environments inside the
        # author note's own definition in the preamble are not counted as a
        # second figure in the body.
        '\begin{figure}[H]': 1

# The same figure again with panels written as plain markdown images, which is
# neither a float nor a cell and keeps its note on the image itself.

- fixture: multipanel-notes-image.qmd
  to: apaquarto-html
  expect:
    html:
      contains:
        - 'Panel A'
        - 'Panel B'
        - 'A note belonging to the whole figure.'
        - 'A note belonging to the left panel.'
        - 'A note belonging to the right panel.'
      count:
        'class="SubPanelNote': 2
        'class="FigureNote NoIndent"': 1

- fixture: multipanel-notes-image.qmd
  to: apaquarto-docx
  expect:
    docx:
      contains:
        - 'Panel A'
        - 'Panel B'
        - 'A note belonging to the whole figure.'
        - 'A note belonging to the left panel.'
        - 'A note belonging to the right panel.'
    docx-xml:
      count:
        '<w:tbl>': 1

- fixture: multipanel-notes-image.qmd
  to: apaquarto-typst
  expect:
    pdf:
      contains:
        # The caption follows the label rather than sitting under the picture.
        - 'Panel A. First panel.'
        - 'Panel B. Second panel.'
        - 'A note belonging to the whole figure.'
      count:
        # Once each. The first panel's note used to be printed a second time
        # after the whole figure.
        'A note belonging to the left panel.': 1
        'A note belonging to the right panel.': 1

- fixture: multipanel-notes-image.qmd
  to: apaquarto-pdf
  expect:
    pdf:
      contains:
        - 'Panel A. First panel.'
        - 'Panel B. Second panel.'
        - 'A note belonging to the left panel.'
        - 'A note belonging to the right panel.'
        - 'A note belonging to the whole figure.'
    tex:
      count:
        'begin{apapanel}': 2
        # Named with its placement, so that the figure environments inside the
        # author note's own definition in the preamble are not counted as a
        # second figure in the body.
        '\begin{figure}[H]': 1

# ------------------------------------------- abstract written in the document --

- fixture: abstract-section.qmd
  to: apaquarto-html
  expect:
    html:
      contains:
        - 'The body of the article starts here'
      count:
        # Once each: on the title page, and not still in the body as well.
        'The first paragraph of an abstract that was written in the document.': 1
        'The second paragraph, which is here to show that both of them arrive.': 1
        'A statement of the impact, written in the document beside the abstract.': 1

- fixture: abstract-section.qmd
  to: apaquarto-docx
  expect:
    docx:
      count:
        'The first paragraph of an abstract that was written in the document.': 1
        'The second paragraph, which is here to show that both of them arrive.': 1
        'A statement of the impact, written in the document beside the abstract.': 1

- fixture: abstract-section.qmd
  to: apaquarto-typst
  expect:
    typ:
      absent:
        # As above: a heading of that name means the section is still in the
        # body rather than on the title page.
        - '= Abstract'
        - '= Impact Statement'
        - '= Introduction'
    pdf:
      contains:
        - 'The body of the article starts here'
      count:
        'The first paragraph of an abstract that was written in the document.': 1
        'The second paragraph, which is here to show that both of them arrive.': 1
        'A statement of the impact, written in the document beside the abstract.': 1

- fixture: abstract-section.qmd
  to: apaquarto-pdf
  expect:
    pdf:
      contains:
        - 'The body of the article starts here'
      count:
        'The first paragraph of an abstract that was written in the document.': 1
        'The second paragraph, which is here to show that both of them arrive.': 1
        'A statement of the impact, written in the document beside the abstract.': 1
    tex:
      absent:
        # Counting the sentences is not enough on its own: left in the body as
        # an ordinary section, each of them still appears exactly once. What
        # says the section was taken up into the title page is that latex is
        # not setting a section of that name.
        - 'section{Abstract}'
        - 'section{Impact Statement}'
        - 'section{Introduction}'

