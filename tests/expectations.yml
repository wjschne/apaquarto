# ----------------------------------------------------------------- margins --
#
# A document's own margins, in every format that has pages: geometry for the
# .pdf, margin for typst and .docx. The mode's page is written first and the
# document's after it, so the document wins on what it names.

- fixture: margins.qmd
  to: apaquarto-pdf
  expect:
    layout:
      # Where the body text starts on the page: the document's 1.5in and the half-inch first-line indent.
      - left: Some
        is: 144
    tex:
      contains:
        # The mode's inch, then the document's margin: x is left and right,
        # and 2cm is 0.787402in.
        - '\usepackage[margin=1in,left=1.5in,right=1.5in,top=0.787402in]{geometry}'

- fixture: margins-geometry.qmd
  to: apaquarto-pdf
  expect:
    layout:
      # Where the body text starts on the page: geometry's 3in, not margin's 2in, and the half-inch indent.
      - left: Some
        is: 252
    tex:
      contains:
        # geometry after margin, so it wins where both name a side, and an
        # option margin has no word for is passed through.
        - '\usepackage[margin=1in,left=2in,left=3in,includehead]{geometry}'

- fixture: margins.qmd
  to: apaquarto-typst
  expect:
    layout:
      # Where the body text starts on the page: the document's 1.5in and the half-inch first-line indent.
