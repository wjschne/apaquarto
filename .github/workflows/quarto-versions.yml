# apaquarto against several versions of quarto, weekly.
#
# This is the one that earns its keep. Quarto 1.10 turned a typst document's
# bibliography paths into raw typst inlines, which made apaquarto throw the
# whole bibliography away and left every citation unresolved; the release was
# months old before anyone noticed. A weekly run against the pre-release says
# so before it reaches a writer with a deadline.
#
# The floor the manifests name is ">=1.9.0", which was never a release;
# "1.9.38" is the oldest 1.9 this matrix can actually install, so it stands in
# for the floor. Raise both together when quarto-required is raised.

name: quarto-versions

on:
  schedule:
    # Mondays, early UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  render:
    name: quarto ${{ matrix.quarto }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        quarto: ["1.9.38", "release", "pre-release"]

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'

      - uses: quarto-dev/quarto-actions/setup@v2
        # quarto installs tinytex by asking the github api for the latest
        # rstudio/tinytex-releases, and an unauthenticated call from a shared
        # runner address is rate limited: "Unable to determine latest release
        # for rstudio/tinytex-releases, 403 - Forbidden", which fails the job
        # before a single document is rendered. The token every workflow run
        # already has raises that limit; it needs no permissions beyond the
        # read this repository grants by default.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: ${{ matrix.quarto }}
          tinytex: true

      - name: Show versions
        run: quarto --version

      # apaquarto puts the orcid mark in the author note as the svg it ships,
      # and quarto turns an svg into a pdf with rsvg-convert. It bundles that
      # on windows and on a mac and not on linux, where the render stops at
      # "Could not convert a SVG to a PDF for output". Only the plain latex
      # format reaches this: apaquarto-pdf draws the mark with apa7's own
      # addORCIDlink and asks for no image at all.
      - name: Install rsvg-convert for svg images in pdf
        run: sudo apt-get install -y librsvg2-bin

      # No snapshot comparison: a new quarto is allowed to write a slightly
      # different .tex or .typ, and that on its own is not a fault. What this
      # job is looking for is an output that no longer says what it should.
      - name: Fixtures
        run: Rscript tests/run-tests.R --no-snapshots

      - name: example.qmd in every format
        run: |
          for format in apaquarto-html apaquarto-docx apaquarto-typst \
                        apaquarto-pdf; do
            echo "::group::$format"
            quarto render example.qmd --to "$format"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-quarto-${{ matrix.quarto }}
          path: tests/_results/
          retention-days: 14
