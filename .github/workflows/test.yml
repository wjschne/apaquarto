# The quick one: every push and every pull request.
#
# Linux only, on the quarto everyone is expected to have. It renders the
# fixtures in tests/ and checks what comes out, then renders example.qmd in
# every format as a broad smoke test. Anything that needs another operating
# system or another quarto is left to cross-platform.yml and
# quarto-versions.yml, which run less often because they cost more.

name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Reads DESCRIPTION, installs what it lists, and caches the result. The
      # ubuntu runner also needs the system libraries behind svglite, pdftools
      # and flextable; pak works those out from the packages themselves.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Show versions
        run: |
          quarto --version
          Rscript -e 'cat(R.version.string, "\n")'

      # The snapshots of the .tex and .typ are compared here and only here.
      # They are text quarto writes the same way every time on one platform,
      # but font and path differences across platforms would make them report
      # a difference that means nothing.
      - name: Fixtures
        run: Rscript tests/run-tests.R

      - name: example.qmd in every format
        run: |
          for format in apaquarto-html apaquarto-docx apaquarto-typst \
                        apaquarto-pdf apaquarto-latex-pdf; do
            echo "::group::$format"
            quarto render example.qmd --to "$format"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: |
            tests/_results/
            example.html
            example.docx
            example.pdf
          retention-days: 7
