# The quick one: every push and every pull request.
#
# Linux only, on one pinned quarto -- see the setup step below for why that
# pin matters. It renders the fixtures in tests/ and checks what comes out,
# then renders example.qmd in every format as a broad smoke test. Anything
# that needs another operating system or another quarto is left to
# cross-platform.yml and quarto-versions.yml, which run less often because
# they cost more.

name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Reads DESCRIPTION, installs what it lists, and caches the result. The
      # ubuntu runner also needs the system libraries behind svglite, pdftools
      # and flextable; pak works those out from the packages themselves.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'

      # The setup action installs with apt, which will not put an older
      # package over a newer one: "Packages were downgraded and -y was used
      # without --allow-downgrades". ubuntu-latest carries a quarto of its
      # own, so whether the pin below is older or newer than the image's is
      # not something this workflow should have to know. The image's copy
      # comes off and the pinned one goes on.
      - name: Remove the quarto the runner image ships
        run: sudo apt-get remove -y quarto || true

      # Pinned, and it has to be. This job is the only one that compares the
      # snapshots, and a snapshot records what one quarto writes: the stock
      # latex preamble and the typst show-call are quarto's, not apaquarto's,
      # and they change between releases. Unpinned, this installed whatever
      # was newest and every .tex differed by four lines of hyperxmp fallback.
      #
      # This must be the quarto that wrote the snapshots. Raise it when you
      # upgrade, and run tests/run-tests.R --update-snapshots in the same
      # commit. quarto-versions.yml is what watches other releases; it
      # compares no snapshots, so it is free to.
      - uses: quarto-dev/quarto-actions/setup@v2
        # quarto installs tinytex by asking the github api for the latest
        # rstudio/tinytex-releases, and an unauthenticated call from a shared
        # runner address is rate limited: "Unable to determine latest release
        # for rstudio/tinytex-releases, 403 - Forbidden", which fails the job
        # before a single document is rendered. The token every workflow run
        # already has raises that limit; it needs no permissions beyond the
        # read this repository grants by default.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true
          version: 1.10.18

      # Quarto turns an svg into a pdf with rsvg-convert, which it bundles on
      # windows and on a mac and not on linux, where a render carrying one
      # stops at "Could not convert a SVG to a PDF for output". No apaquarto
      # format asks for this any more -- the orcid mark did, as the svg
      # apaquarto ships, until the orcidlink package began drawing it in tex
      # -- but a document of one's own may carry an svg figure, and this is
      # what a reader on linux would have to install for it. Keeping it here
      # means a document that includes one is still rendered rather than
      # failing on the runner alone.
      - name: Install rsvg-convert for svg images in pdf
        run: sudo apt-get install -y librsvg2-bin

      - name: Show versions
        run: |
          quarto --version
          Rscript -e 'cat(R.version.string, "\n")'

      # The snapshots of the .tex and .typ are compared here and only here.
      # They are text quarto writes the same way every time on one platform,
      # but font and path differences across platforms would make them report
      # a difference that means nothing.
      - name: Fixtures
        run: Rscript tests/run-tests.R

      # Each format on its own, and the one that fails says so in the run
      # summary. A step that simply dies leaves "Process completed with exit
      # code 1" as its only annotation, and the log behind it is readable
      # only by someone with admin rights on this repository -- so the reason
      # a render failed had to be fetched by hand every time. The tail of the
      # failing render becomes a ::error:: annotation instead, which the run
      # summary and the api both show. %0A is how one annotation carries more
      # than one line, and the % that starts it has to be escaped first or a
      # percentage in the output would eat what follows it.
      - name: example.qmd in every format
        run: |
          status=0
          for format in apaquarto-html apaquarto-docx apaquarto-typst apaquarto-pdf; do
            echo "::group::$format"
            if quarto render example.qmd --to "$format" > "render-$format.log" 2>&1; then
              cat "render-$format.log"
              echo "::endgroup::"
            else
              cat "render-$format.log"
              echo "::endgroup::"
              detail=$(tail -n 40 "render-$format.log" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=$format failed::$detail"
              status=1
              break
            fi
          done
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: |
            tests/_results/
            example.html
            example.docx
            example.pdf
          retention-days: 7
