title: My Document in APA Style, Seventh Edition
author: W. Joel Schneider
version: 6.0.0
quarto-required: ">=1.4.549"
contributes:
  formats:
    common:
      execute:
        echo: false
      citeproc: false
      link-citations: true
      fig-cap-location: top
      tbl-cap-location: top
      cap-location: top
      csl: apa.csl
      toc: false
      fig-width: 6.5
      fig-height: 6.5
      number-depth: 3
      floatsintext: true
      crossref:
        subref-labels: alpha A
      suppress-title-page: false
      suppress-title-page-number: false
      suppress-title: false
      suppress-short-title: false
      suppress-author: false
      suppress-affiliation: false
      suppress-author-note: false
      suppress-orcid: false
      suppress-status-change-paragraph: false
      suppress-disclosures-paragraph: false
      suppress-credit-statement: false
      suppress-corresponding-paragraph: false
      suppress-corresponding-group: false
      suppress-corresponding-department: false
      suppress-corresponding-affiliation-name: false
      suppress-corresponding-address: false
      suppress-corresponding-city: false
      suppress-corresponding-region: false
      suppress-corresponding-postal-code: false
      suppress-corresponding-country: false
      suppress-corresponding-email: false
      suppress-abstract: false
      suppress-impact-statement: false
      suppress-keywords: false
      suppress-supplemental-materials: false
      suppress-title-introduction: false
      no-ampersand-parenthetical: false
      language: 
        citation-last-author-separator: "and"
        citation-masked-author: "Masked Author"
        citation-masked-title: "Masked Title"
        citation-masked-date: "n.d."
        email: "Email"
        figure-table-note: "Note"
        title-block-author-note: "Author Note"
        title-block-correspondence-note: "Correspondence concerning this article should be addressed to"
        title-block-role-introduction: "Author roles were classified using the Contributor Role Taxonomy (CRediT; https://credit.niso.org/) as follows:"
        title-impact-statement: "Impact Statement"
        title-supplemental-materials: "Supplemental materials"
        title-word-count: "Word Count"
        references-meta-analysis: "References marked with an asterisk indicate studies included in the meta-analysis."
      filters:
        # Resolve documentmode aliases (journal, manuscript, document, student)
        # before anything reads the field
        - at: pre-ast
          path: documentmode.lua
        # Sets language defaults other than English
        - at: pre-ast
          path: apalanguage.lua
        # Recover the apa-note of a plain markdown table before quarto
        # flattens it
        - at: pre-ast
          path: apatablenote.lua
        # Prepare plain markdown tables to be used by crossrefprefix.lua
        - at: pre-ast
          path: markdowntable.lua
        # Give figures and tables appendix prefixes
        - at: pre-ast
          path: crossrefprefix.lua
        # Move figures and tables to end of document
        - at: pre-ast
          path: apafloatstoend.lua
        # Mark apa-twocolumn floats (and capture table notes) AFTER float
        # placement but before Quarto realizes markdown tables, so the marker
        # stays adjacent to a float that floatsintext: false has moved to the end.
        - at: pre-ast
          path: apatwocolumntypstcollect.lua
 
        # Set latex document mode
        - at: pre-ast
          path: journalmode.lua
        # Put papersize in the form the latex document class wants
        - at: pre-ast
          path: apapapersize.lua
        # Set latex images to column width by default
        - at: pre-ast
          path: apafigurewidthlatex.lua     
        # Make apa-note an attribute of figure in latex
        - at: pre-ast
          path: apanotelatex.lua
        # Make appendices citable with apx prefix
        - at: pre-ast
          path: apaciteappendix.lua
        # Add a refs div if it was omitted.
        - at: pre-ast
          path: apaomitrefsdiv.lua
        # Finds citations to be masked and converts them to masked citations
        - at: post-ast
          path: apamasked.lua
        # Ensures that images have two-column attribute, when needed
        - at: post-ast
          path: apatwocolumnlatex.lua
        # Formats headers properly
        - at: pre-quarto
          path: apaheader.lua
        # Formats title and authors
        - at: pre-quarto
          path: apastriptitle.lua
        # Word count
        - at: pre-quarto
          path: wordcount.lua
        # Formats title page, abstract (all except latex)
        - at: pre-quarto
          path: frontmatter.lua
        # Formats multi-paragraph quotes
        - at: pre-quarto
          path: apaquote.lua
        # Indentation for latex, allow for no indenting command
        - at: pre-quarto
          path: latexnoindent.lua
        # Inserts appendix prefixes to tables and figures
        - at: pre-quarto
          path: apafigtblappendix.lua
        - at: post-quarto
          path: floatwithsubfigure.lua
        # Process tables and figures in latex
        - at: post-quarto
          path: apafloatlatex.lua
        # Tell latex if there is one author and/or one affiliation
        - at: post-quarto
          path: apaoneauthoraffiliation.lua
        # Removes surrounding table environment for docx figures and tables
        - at: post-render
          path: apaextractfigure.lua
        # Formats notes below figures and tables (docx, html, typst)
        - at: post-render
          path: apanote.lua
        # Adds styles to figures and tables 
        - at: post-render
          path: apafloat.lua
        # Formats captions for figures and tables 
        - at: post-render
          path: apacaption.lua
        # Puts proper spacing for paragraphs after figures and tables
        - at: post-render
          path: apaafternote.lua
        # Span apa-twocolumn figures across both columns in typst journal mode
        - at: post-render
          path: apatwocolumntypst.lua
        # Process citations, adds asterisks for meta-analysis citations
        - at: post-render
          path: citeprocr.lua
        # Process APA in-text citations (ampersand to and, possessive citation)
        - at: post-render
          path: apaandcite.lua
        # Process appendices in latex
        - at: post-render
          path: apaappendixlatex.lua
        # Warn when a pdf standard cannot work with the document's tables
        - at: post-render
          path: apapdfstandard.lua
    native: default
    html:
      filters:
        # Place tinytable tables with tbl-align, left by default
        - at: post-quarto
          path: apatinytablehtml.lua
      toc: true
      toc-location: left
      anchor-sections: false
      fig-cap-location: top
      html-math-method: katex
      # An {{< embed other.qmd#fig-x >}} makes quarto render the source
      # document a second time, from a copy it writes to .quarto/embed, to
      # build a standalone preview page for the "Source:" link. That render
      # resolves the theme against .quarto/embed rather than the project, so
      # it cannot find _extensions/apaquarto/apa.scss ("Theme file not found")
      # and falls back to stock bootstrap -- a preview page with none of this
      # format's styling. The embedded output itself is unaffected: it is
      # inlined into the article, which has the theme. Turning the preview off
      # drops the warning and the unstyled page; set notebook-view: true to
      # get the "Source:" link back.
      notebook-view: false
      mainfont: Times, Times New Roman, serif
      monofont: Consolas, Lucida Console, Courier New, monospace
      grid: 
        body-width: "7in"
      css: apa.css
      theme: 
        - apa.scss
      template-partials:
        - title-block.html
      knitr: 
        opts_chunk: 
          dev: svglite
    pdf:
      documentclass: apa7
      pdf-engine: lualatex
      suppress-bibliography: false
      hyperrefoptions: 
        - linktoc=none
      block-headings: false
      template: apatemplate.tex
      mainfontfallback: Arial
      template-partials:
        - doc-class.tex
        - title.tex
        - header.tex
      classoption: "colorlinks=true,linkcolor=blue,citecolor=blue,urlcolor=blue"
    docx: 
      reference-doc: apaquarto.docx
      filters: 
        # Add custom styles to docx
        - at: post-quarto
          path: docxstyler.lua
        # Format Latex symbol
        - at: post-render
          path: docxformatlatexsymbol.lua
        # Set the docx fonts and page size from the mainfont, monofont
        # and papersize options
        - at: post-render
          path: docxreferencedoc.lua
      knitr: 
        opts_chunk: 
          dev: ragg_png
    typst:
      filters: 
        # Process typst-specific styles
        - at: post-quarto
          path: typst/formattypst.lua
      template-partials:
        - typst/typst-template.typ
        - typst/typst-show.typ
      format-resources:
        - apa.csl
