title: APA Style, Seventh Edition, in plain LaTeX
author: W. Joel Schneider
version: 6.0.0
quarto-required: ">=1.9.0"
contributes:
  formats:
    pdf:
      # An alternative to apaquarto-pdf that does not use the apa7 class.
      #
      # apa7 lays out the title page, the headings, the running head and the
      # floats itself, and apaquarto-pdf spends most of its code persuading it
      # to do those the way quarto wants. This format does none of that. It
      # takes the same blocks that the .html, .docx and typst formats are built
      # out of -- frontmatter.lua writes the title page, apanote.lua writes the
      # notes -- and asks latex only to set them, through the style file below.
      # What is left is a page of style definitions instead of a class to argue
      # with, and quarto's own pdf template, unmodified.
      #
      # apaquarto-pdf is untouched by any of this and remains the apa7 format.

      # Read by apaquarto's shared filters, which otherwise leave the work to
      # apa7 whenever the output is latex. See utilsapa.apa7_latex.
      apaquarto-plain-latex: true

      # APA asks for a serif face of ordinary weight, and names Times New
      # Roman first. TeX Gyre Termes is metrically the same face and ships
      # with every TeX distribution, so a document sets the same lines on a
      # machine that has no Times New Roman on it -- a Linux box, or CI.
      #
      # The engine below is lualatex, so quarto's template loads fontspec and
      # unicode-math and the face is asked for by name.
      #
      # Text only. newtxtext and newtxmath, which are the usual way of getting
      # Times into a LaTeX document, are written for pdflatex: newtxmath sets
      # up math the traditional way and clashes with the unicode-math that
      # template loads, and nothing here can unload it. Math is left to
      # unicode-math's own default, Latin Modern Math, which every
      # distribution has. Setting mathfont to "TeX Gyre Termes Math" beside
      # this would match the math to the text, at the cost of a font package
      # (tex-gyre-math) that is not installed by default.
      mainfont: "TeX Gyre Termes"

      documentclass: article
      classoption:
        - 12pt
      pdf-engine: lualatex
      papersize: letter
      geometry:
        - margin=1in
      indent: true
      colorlinks: true
      linkcolor: blue
      citecolor: blue
      urlcolor: blue
      link-citations: true
      number-sections: false
      fig-cap-location: top
      tbl-cap-location: top
      cap-location: top
      citeproc: false
      # The style apaquarto ships, read from the extension beside this one.
      # Quarto works the path out from this file rather than from the document,
      # so the style is found wherever the document is and nothing is copied
      # next to it.
      #
      # Naming it "apa.csl" and listing ../apaquarto/apa.csl under
      # format-resources looked equivalent and was not: the render stopped with
      # "File apa.csl not found in resource path" in any directory where an
      # apaquarto format had not been rendered first. Those formats do copy the
      # style next to the document, which left it lying there and made this one
      # appear to work.
      csl: ../apaquarto/apa.csl
      floatsintext: true
      documentmode: man
      include-in-header:
        - apalatex.tex
      knitr:
        opts_chunk:
          dev: ragg_png

      filters:
        # Resolve documentmode aliases before anything reads the field
        - at: pre-ast
          path: ../apaquarto/documentmode.lua
        # Language defaults other than English
        - at: pre-ast
          path: ../apaquarto/apalanguage.lua
        # An abstract or impact statement written as a section of the document
        # rather than as a yaml field
        - at: pre-ast
          path: ../apaquarto/abstractsection.lua
        # APA does not label the introduction, so a heading that does is
        # taken out
        - at: pre-ast
          path: ../apaquarto/introductionheading.lua
        # Recover the apa-note of a plain markdown table before quarto
        # flattens it
        - at: pre-ast
          path: ../apaquarto/apatablenote.lua
        # Prepare plain markdown tables for crossrefprefix.lua
        - at: pre-ast
          path: ../apaquarto/markdowntable.lua
        # Give figures and tables appendix prefixes
        - at: pre-ast
          path: ../apaquarto/crossrefprefix.lua
        # Move figures and tables to the end when floatsintext is false
        - at: pre-ast
          path: ../apaquarto/apafloatstoend.lua
        # Make appendices citable with the apx prefix
        - at: pre-ast
          path: ../apaquarto/apaciteappendix.lua
        # Add a refs div if it was omitted
        - at: pre-ast
          path: ../apaquarto/apaomitrefsdiv.lua
        # Mask citations for blind review
        - at: post-ast
          path: ../apaquarto/apamasked.lua
        # Format headings
        - at: pre-quarto
          path: ../apaquarto/apaheader.lua
        # Keep quarto from setting its own title block
        - at: pre-quarto
          path: ../apaquarto/apastriptitle.lua
        # Word count
        - at: pre-quarto
          path: ../apaquarto/wordcount.lua
        # Title page, abstract, keywords, author note
        - at: pre-quarto
          path: ../apaquarto/frontmatter.lua
        # Multi-paragraph block quotes
        - at: pre-quarto
          path: ../apaquarto/apaquote.lua
        # Appendix prefixes on figures and tables
        - at: pre-quarto
          path: ../apaquarto/apafigtblappendix.lua
        # Subfigure layouts
        - at: post-quarto
          path: ../apaquarto/floatwithsubfigure.lua
        # Set figures and tables the APA way
        - at: post-quarto
          path: floatlatex.lua
        # Recover the apa-note of an embedded figure or table
        - at: post-render
          path: ../apaquarto/embednote.lua
        # Write the notes below figures and tables
        - at: post-render
          path: ../apaquarto/apanote.lua
        # Figure and table titles
        - at: post-render
          path: ../apaquarto/apacaption.lua
        # Citations, asterisks for meta-analysis entries. Before formatlatex.lua,
        # which turns the refs div into raw latex: citeproc puts the finished
        # bibliography inside the div whose identifier is "refs", and with the
        # div already written out there was nothing left to put it in, so the
        # entries went to the end of the document, below the appendices,
        # instead of under the References heading.
        - at: post-render
          path: ../apaquarto/citeprocr.lua
        # APA in-text citations
        - at: post-render
          path: ../apaquarto/apaandcite.lua
        # Turn the blocks the filters above produced into latex. Last, so that
        # everything it writes out has been built by then.
        - at: post-render
          path: formatlatex.lua
